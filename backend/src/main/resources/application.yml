spring:
  application:
    name: learning-platform-backend
  profiles:
    # 本轮只实现 API 进程；后续独立 worker 的配置随后台任务功能加入。
    default: api
  jackson:
    deserialization:
      # 请求 DTO 未声明的字段必须拒绝，避免拼写错误或越界字段被悄悄忽略。
      fail-on-unknown-properties: true
  datasource:
    # 真实账号由终端、IDE 或本地启动脚本注入；仓库中不写数据库密码。
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: learning-platform-pool
      maximum-pool-size: 5
      minimum-idle: 1
      # 获取连接和验证均有限等待，避免数据库失效时健康检查长时间挂住。
      connection-timeout: 2000
      validation-timeout: 1000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      # DATETIME 不自动换时区；每条新连接均明确采用 UTC。
      connection-init-sql: SET time_zone = '+00:00'
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
        connectTimeout: 2000
        socketTimeout: 3000
  flyway:
    locations: classpath:db/migration
    # 保留启动校验；迁移错误或数据库初始不可用时，不带着错误表结构启动。
    validate-on-migrate: true
    clean-disabled: true
  sql:
    init:
      # 表结构只交给 Flyway，避免再混入 schema.sql 等另一套初始化流程。
      mode: never

mybatis:
  # 接口定义 Java 方法，XML 保存对应 SQL；两者通过完整接口名和方法名关联。
  mapper-locations: classpath*:mapper/**/*.xml

auth:
  session:
    # 活跃会话续期只修改空闲期限，不能突破自创建起的绝对期限。
    idle-timeout: ${AUTH_SESSION_IDLE_TIMEOUT:PT12H}
    absolute-timeout: ${AUTH_SESSION_ABSOLUTE_TIMEOUT:P7D}
  http:
    # 预登录签名 Cookie 的有效期，与契约 x-cookie-policy 保持一致。
    pre-login-max-age: PT10M
    # 预登录 CSRF 签名密钥；生产必须显式提供，缺失时进程随机生成（仅单机开发可接受）。
    pre-login-signing-key: ${AUTH_PRE_LOGIN_SIGNING_KEY:}
    # 允许的浏览器 Origin（逗号分隔）；代理不得伪造 Origin 掩盖非法请求。
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://127.0.0.1:4173,http://localhost:4173}
    # 生产 HTTPS 环境设为 true，Cookie 加 Secure；本地 HTTP 保持 false。
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  login-rate-limit:
    # 同一“用户名+IP”组合的失败登录窗口与上限；成功登录清除计数。
    window: PT5M
    max-failures: 5
