          type: object
          additionalProperties: false
          properties:
            allCount:
              type: integer
              minimum: 0
              maximum: 2147483647
              description: 全部本人可读的已发布和归档作业数，等于另外三项之和。
            todoCount:
              type: integer
              minimum: 0
              maximum: 2147483647
              description: 教学班 active、作业 published，且个人状态为 NOT_STARTED 或 IN_PROGRESS 的数量。
            doneCount:
              type: integer
              minimum: 0
              maximum: 2147483647
              description: 个人状态为 SUBMITTED 或 REVIEWED 的数量，包含归档历史；不表示已掌握。
            archivedIncompleteCount:
              type: integer
              minimum: 0
              maximum: 2147483647
              description: 个人状态为 NOT_STARTED 或 IN_PROGRESS，且教学班或作业已归档的数量；仅在 all 中显示，不计入 todo 或 done。
          required:
          - allCount
          - todoCount
          - doneCount
          - archivedIncompleteCount
