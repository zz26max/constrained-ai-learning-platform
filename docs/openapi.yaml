      operationId: recordLearningPosition
      summary: recordLearningPosition
      description: 权限：本班学生，需 CSRF。请求约定：`{offeringId,chapterId?,assignmentId?}`；必须且仅指定一种目标。结果约定：200 `{offeringId,lastChapterId,lastStudiedAt}`，服务端校验已发布且可访问目标，不接受客户端时间。业务规则以
