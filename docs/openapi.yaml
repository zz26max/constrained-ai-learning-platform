            - {$ref: '#/components/schemas/Failure_INTERNAL_ERROR'}
    getCsrfToken_503:
      description: SERVICE_UNAVAILABLE
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestID'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/Failure_SERVICE_UNAVAILABLE'}
    login_200:
      description: 200 `{user:UserDTO,csrfToken}`；轮换会话
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestID'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
        Set-Cookie: {$ref: '#/components/headers/SetCookie'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Response_login'}
    login_401:
      description: INVALID_CREDENTIALS
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestID'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/Failure_INVALID_CREDENTIALS'}
    login_403:
      description: CSRF_INVALID
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestID'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/Failure_CSRF_INVALID'}
    login_415:
      description: UNSUPPORTED_MEDIA_TYPE
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestID'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/Failure_UNSUPPORTED_MEDIA_TYPE'}
    login_429:
      description: RATE_LIMITED
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestID'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/Failure_RATE_LIMITED'}
    logout_200:
      description: 200 `{loggedOut:true}`；清除 Cookie
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestID'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
        Set-Cookie: {$ref: '#/components/headers/SetCookie'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Response_logout'}
    logout_401:
      description: UNAUTHENTICATED
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestID'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/Failure_UNAUTHENTICATED'}
    logout_403:
      description: FORBIDDEN / CSRF_INVALID
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestID'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
      content:
        application/json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/Failure_FORBIDDEN'}
            - {$ref: '#/components/schemas/Failure_CSRF_INVALID'}
    logout_404:
      description: NOT_FOUND
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestID'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
