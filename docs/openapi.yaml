openapi: 3.1.1
info:
  title: 个性化学习平台接口契约
  version: 1.0.1
  description: 设计基线 2026-10-11。实现状态以各 operation 的 x-implementation-status 为准，并由后端生产路由测试双向核对；本段不重复维护接口状态数量。
    reviewed 表示静态契约审计，不等于运行验收；implemented 不表示联调环境已部署。字段以此文件为唯一结构源；运行规则见 DEVELOPMENT.md，存储见 BACKEND.md。
servers:
- {url: /}
security:
- {SessionCookie: []}
tags:
- {name: auth}
- {name: student}
- {name: teacher}
- {name: health}
paths:
  /api/v1/auth/csrf-token:
    get:
      operationId: getCsrfToken
      summary: getCsrfToken
      description: 权限：匿名或登录用户。请求约定：无。结果约定：200 `{csrfToken}`；匿名时设置签名预登录 Cookie，登录后返回会话绑定令牌。业务规则以 DEVELOPMENT.md 为准。
      tags:
      - auth
      x-phase: P0
      x-implementation-status: verified
      x-contract-status: reviewed
      x-permission: 匿名或登录用户
      x-csrf-required: false
      x-idempotency: none
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$', maxLength: 64, minLength: 1}
      responses:
        '200': {$ref: '#/components/responses/getCsrfToken_200'}
        '400': {$ref: '#/components/responses/getCsrfToken_400'}
        '406': {$ref: '#/components/responses/getCsrfToken_406'}
        '422': {$ref: '#/components/responses/getCsrfToken_422'}
        '500': {$ref: '#/components/responses/getCsrfToken_500'}
        '503': {$ref: '#/components/responses/getCsrfToken_503'}
      security: []
  /api/v1/auth/login:
    post:
      operationId: login
      summary: login
      description: 权限：匿名，需 CSRF。请求约定：`{username,password}`。结果约定：200 `{user:UserDTO,csrfToken}`；轮换会话。业务规则以 DEVELOPMENT.md 为准。
        登录成功轮换 lp_session 并清除 lp_pre_auth；失败不撤销既有会话。
      tags:
      - auth
      x-phase: P0
      x-implementation-status: verified
      x-contract-status: reviewed
      x-permission: 匿名，需 CSRF
      x-csrf-required: true
      x-idempotency: none
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$', maxLength: 64, minLength: 1}
      - name: X-CSRF-Token
        in: header
        required: true
        schema: {type: string, maxLength: 512, minLength: 1}
      - name: Origin
        in: header
        required: true
        schema: {type: string, format: uri}
      responses:
        '200': {$ref: '#/components/responses/login_200'}
        '400': {$ref: '#/components/responses/getCsrfToken_400'}
        '401': {$ref: '#/components/responses/login_401'}
        '403': {$ref: '#/components/responses/login_403'}
        '406': {$ref: '#/components/responses/getCsrfToken_406'}
        '415': {$ref: '#/components/responses/login_415'}
        '422': {$ref: '#/components/responses/getCsrfToken_422'}
        '429': {$ref: '#/components/responses/login_429'}
        '500': {$ref: '#/components/responses/getCsrfToken_500'}
        '503': {$ref: '#/components/responses/getCsrfToken_503'}
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginWrite'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: logout
      description: 权限：已登录，需 CSRF。请求约定：`{}`。结果约定：200 `{loggedOut:true}`；清除 Cookie。业务规则以 DEVELOPMENT.md 为准。
      tags:
      - auth
      x-phase: P0
      x-implementation-status: verified
      x-contract-status: reviewed
      x-permission: 已登录，需 CSRF
      x-csrf-required: true
      x-idempotency: none
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$', maxLength: 64, minLength: 1}
      - name: X-CSRF-Token
        in: header
        required: true
        schema: {type: string, maxLength: 512, minLength: 1}
      - name: Origin
        in: header
        required: true
        schema: {type: string, format: uri}
      responses:
        '200': {$ref: '#/components/responses/logout_200'}
        '400': {$ref: '#/components/responses/getCsrfToken_400'}
        '401': {$ref: '#/components/responses/logout_401'}
        '403': {$ref: '#/components/responses/logout_403'}
        '404': {$ref: '#/components/responses/logout_404'}
        '406': {$ref: '#/components/responses/getCsrfToken_406'}
        '415': {$ref: '#/components/responses/login_415'}
        '422': {$ref: '#/components/responses/getCsrfToken_422'}
        '500': {$ref: '#/components/responses/getCsrfToken_500'}
        '503': {$ref: '#/components/responses/getCsrfToken_503'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Empty'}
  /api/v1/me:
    get:
      operationId: getMe
      summary: getMe
      description: 权限：已登录。请求约定：无。结果约定：200 `UserDTO`。业务规则以 DEVELOPMENT.md 为准。
      tags:
      - auth
      x-phase: P0
      x-implementation-status: verified
      x-contract-status: reviewed
      x-permission: 已登录
      x-csrf-required: false
      x-idempotency: none
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$', maxLength: 64, minLength: 1}
      responses:
        '200': {$ref: '#/components/responses/getMe_200'}
        '400': {$ref: '#/components/responses/getCsrfToken_400'}
        '401': {$ref: '#/components/responses/logout_401'}
        '403': {$ref: '#/components/responses/getMe_403'}
        '404': {$ref: '#/components/responses/logout_404'}
        '406': {$ref: '#/components/responses/getCsrfToken_406'}
        '422': {$ref: '#/components/responses/getCsrfToken_422'}
        '500': {$ref: '#/components/responses/getCsrfToken_500'}
        '503': {$ref: '#/components/responses/getCsrfToken_503'}
  /api/v1/me/config:
    get:
      operationId: getConfig
      summary: getConfig
      description: 权限：已登录。请求约定：无。结果约定：200 `{apiVersion:'v1',serverTime,timezone:'Asia/Shanghai',currentTermId,terms:[{id,label,startsAt,endsAt}],features:{aiTutoring,learningAnalytics,serverChecks}}`。业务规则以
        DEVELOPMENT.md 为准。
      tags:
      - auth
      x-phase: P0
      x-implementation-status: verified
      x-contract-status: reviewed
      x-permission: 已登录
      x-csrf-required: false
      x-idempotency: none
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$', maxLength: 64, minLength: 1}
      responses:
        '200': {$ref: '#/components/responses/getConfig_200'}
        '400': {$ref: '#/components/responses/getCsrfToken_400'}
        '401': {$ref: '#/components/responses/logout_401'}
        '403': {$ref: '#/components/responses/getMe_403'}
        '404': {$ref: '#/components/responses/logout_404'}
        '406': {$ref: '#/components/responses/getCsrfToken_406'}
        '422': {$ref: '#/components/responses/getCsrfToken_422'}
        '500': {$ref: '#/components/responses/getCsrfToken_500'}
        '503': {$ref: '#/components/responses/getCsrfToken_503'}
  /api/v1/me/dashboard:
    get:
      operationId: getDashboard
      summary: getDashboard
      description: 权限：学生。请求约定：可选 `termId`。结果约定：200 `DashboardDTO`，字段见示例。业务规则以 DEVELOPMENT.md 为准。
      tags:
      - student
      x-phase: P1
      x-implementation-status: planned
      x-contract-status: reviewed
      x-permission: 学生
      x-csrf-required: false
      x-idempotency: none
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$', maxLength: 64, minLength: 1}
      - name: termId
        in: query
        required: false
        schema: {$ref: '#/components/schemas/UUID'}
      responses:
        '200': {$ref: '#/components/responses/getDashboard_200'}
        '400': {$ref: '#/components/responses/getCsrfToken_400'}
        '401': {$ref: '#/components/responses/logout_401'}
        '403': {$ref: '#/components/responses/getMe_403'}
        '404': {$ref: '#/components/responses/logout_404'}
        '406': {$ref: '#/components/responses/getCsrfToken_406'}
        '422': {$ref: '#/components/responses/getCsrfToken_422'}
        '500': {$ref: '#/components/responses/getCsrfToken_500'}
        '503': {$ref: '#/components/responses/getCsrfToken_503'}
  /api/v1/me/courses:
    get:
      operationId: listMyCourses
      summary: listMyCourses
      description: 权限：学生。请求约定：可选 `termId,status=active\|archived\|all`（默认 active）；`page,pageSize`。结果约定：200 `List<CourseSummaryDTO>`。业务规则以
        DEVELOPMENT.md 为准。
      tags:
      - student
      x-phase: P1
      x-implementation-status: planned
      x-contract-status: reviewed
      x-permission: 学生
      x-csrf-required: false
      x-idempotency: none
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$', maxLength: 64, minLength: 1}
      - name: page
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 2147483647, default: 1}
      - name: pageSize
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      - name: termId
        in: query
        required: false
        schema: {$ref: '#/components/schemas/UUID'}
      - name: status
        in: query
        required: false
        schema: {type: string, enum: [active, archived, all], default: active}
      responses:
        '200': {$ref: '#/components/responses/listMyCourses_200'}
        '400': {$ref: '#/components/responses/getCsrfToken_400'}
        '401': {$ref: '#/components/responses/logout_401'}
        '403': {$ref: '#/components/responses/getMe_403'}
        '404': {$ref: '#/components/responses/logout_404'}
        '406': {$ref: '#/components/responses/getCsrfToken_406'}
        '422': {$ref: '#/components/responses/getCsrfToken_422'}
        '500': {$ref: '#/components/responses/getCsrfToken_500'}
        '503': {$ref: '#/components/responses/getCsrfToken_503'}
      x-sort: createdAt DESC, id DESC
  /api/v1/me/enrollments:
    post:
      operationId: enroll
      summary: enroll
      description: 权限：学生，需 CSRF。请求约定：`{inviteCode}`。结果约定：新加入 201 `{offeringId,enrolledAt,created:true}`；已加入幂等 200，同对象且 `created:false`。业务规则以
        DEVELOPMENT.md 为准。 201 的 created 必须 true；重复加入 200 必须 false。
      tags:
      - student
      x-phase: P1
      x-implementation-status: planned
      x-contract-status: reviewed
      x-permission: 学生，需 CSRF
      x-csrf-required: true
      x-idempotency: none
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$', maxLength: 64, minLength: 1}
      - name: X-CSRF-Token
        in: header
        required: true
        schema: {type: string, maxLength: 512, minLength: 1}
      - name: Origin
        in: header
        required: true
        schema: {type: string, format: uri}
      responses:
        '201': {$ref: '#/components/responses/enroll_201'}
        '200': {$ref: '#/components/responses/enroll_201'}
        '400': {$ref: '#/components/responses/enroll_400'}
        '401': {$ref: '#/components/responses/logout_401'}
        '403': {$ref: '#/components/responses/logout_403'}
        '404': {$ref: '#/components/responses/logout_404'}
        '406': {$ref: '#/components/responses/getCsrfToken_406'}
        '409': {$ref: '#/components/responses/enroll_409'}
        '415': {$ref: '#/components/responses/login_415'}
        '422': {$ref: '#/components/responses/getCsrfToken_422'}
        '429': {$ref: '#/components/responses/login_429'}
        '500': {$ref: '#/components/responses/getCsrfToken_500'}
        '503': {$ref: '#/components/responses/getCsrfToken_503'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollmentWrite'}
  /api/v1/offerings/{offeringId}:
    get:
      operationId: getOffering
      summary: getOffering
      description: 权限：本班学生或授课教师。请求约定：无。结果约定：200 `OfferingDTO`。业务规则以 DEVELOPMENT.md 为准。
      tags:
      - student
      x-phase: P1
      x-implementation-status: planned
      x-contract-status: reviewed
      x-permission: 本班学生或授课教师
      x-csrf-required: false
      x-idempotency: none
      parameters:
