    get:
      operationId: listChapters
      summary: listChapters
      description: 权限：本班成员。请求约定：无。结果约定：200 `{offeringId,items:ChapterSummaryDTO[]}`，按 `number` 升序；公共目录只列已发布章节。业务规则以 DEVELOPMENT.md
