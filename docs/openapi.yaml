      x-contract-status: reviewed
      x-permission: 本班成员
      x-csrf-required: false
      x-idempotency: none
      parameters:
      - name: offeringId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/UUID'}
      - name: X-Request-ID
        in: header
        required: false
        schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$', maxLength: 64, minLength: 1}
      responses:
        '200': {$ref: '#/components/responses/listChapters_200'}
        '400': {$ref: '#/components/responses/getCsrfToken_400'}
