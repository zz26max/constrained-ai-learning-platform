name: Contract and documentation

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docs/**'
      - 'scripts/*.py'
      - 'scripts/requirements-contract.txt'
      - 'README.md'
      - '.github/workflows/contract.yml'
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docs/**'
      - 'scripts/*.py'
      - 'scripts/requirements-contract.txt'
      - 'README.md'
      - '.github/workflows/contract.yml'

permissions:
  contents: read

jobs:
  contract:
    name: Contract and documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-contract.txt
      - run: python -m pip install -r scripts/requirements-contract.txt
      - run: python scripts/validate_contract.py

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # verify 覆盖 test：除单元与 MockMvc 契约测试外，还运行 Testcontainers 真实 MySQL 集成测试并打包。
      # GitHub 托管 runner 自带 Docker，数据库验证不会因缺少引擎被静默跳过。
      - name: Unit, HTTP contract and Testcontainers MySQL tests
        working-directory: backend
        run: bash ./mvnw --batch-mode verify

  frontend:
    name: Frontend typecheck, build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # verify = vue-tsc 类型检查 + vite 构建 + 生产构建拒绝 mock + vitest。
      - run: npm run verify
